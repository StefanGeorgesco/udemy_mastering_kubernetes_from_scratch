# Create these resources with `kubectl apply -f sec07-configuration/04-simple-secret.yml`
# Type `kubectl logs pod/simple-pod` to see the logs of the simple-pod container
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
data:
  username: c3RlZmFu
  password: YWRtaW4xMjM=
---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      env:
        - name: "app_username"
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username
        - name: "app_password"
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password
      args:
        - env
