# Create these resources with `kubectl apply -f sec07-configuration/05-inject-secret-as-env.yml`
# Type `kubectl logs pod/simple-pod` to see the logs of the simple-pod container
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
data:
  username: c3RlZmFu
  password: YWRtaW4xMjM=
---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      envFrom:
        - secretRef:
            name: app-secret
      args:
        - env
