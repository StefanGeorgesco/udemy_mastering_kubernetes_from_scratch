# Create these resources with `kubectl apply -f sec07-configuration/02-inject-cm-as-env.yml`
# Type `kubectl logs pod/simple-pod` to see the logs of the simple-pod container
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-properties
data:
  appUrl: "http://my-app-service"
  timeout: "30"
---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      envFrom:
        - configMapRef:
            name: app-properties
      args:
        - env
