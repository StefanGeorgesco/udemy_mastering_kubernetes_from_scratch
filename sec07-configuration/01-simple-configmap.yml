# Create these resources with `kubectl apply -f sec07-configuration/01-simple-configmap.yml`
# Type `kubectl logs pod/simple-pod` to see the logs of the simple-pod container
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-properties
data:
  appUrl: "http://my-app-service"
  timeout: "30"
---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      env:
        - name: "request.timeout"
          valueFrom:
            configMapKeyRef:
              name: app-properties
              key: timeout
        - name: "application.url"
          valueFrom:
            configMapKeyRef:
              name: app-properties
              key: appUrl
      args:
        - env
