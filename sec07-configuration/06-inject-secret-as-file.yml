---
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  terminationGracePeriodSeconds: 1
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      volumeMounts:
        - name: app-secret-volume
          mountPath: /usr/share/secrets
      args:
        - cat
        - "/usr/share/secrets/app.key"
  volumes:
    - name: app-secret-volume
      secret:
        secretName: app-secret
