    bmVyDQphcGlWZXJzaW9uOiB2MQ0Ka2luZDogQ29uZmlnTWFwDQptZXRhZGF0YToNCiAgbmFtZTog
    YXBwLXByb3BlcnRpZXMNCmRhdGE6DQogIGFwcFVybDogImh0dHA6Ly9teS1hcHAtc2VydmljZSIN
