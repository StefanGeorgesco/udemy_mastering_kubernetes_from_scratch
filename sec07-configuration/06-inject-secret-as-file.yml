# Create these resources with `kubectl apply -f sec07-configuration/06-inject-secret-as-file.yml`
# Type `kubectl logs pod/simple-pod` to see the logs of the simple-pod container
# The secret string has been base64-encoded from 01-simple-configmap.yaml file content:
# From sec07-configuration directory, run : `docker run --rm -it -v ${PWD}:/ws ubuntu`,
# then, inside the container:
#   cd /ws
#   cat 01-simple-configmap.yaml | base64
# and copy the resulting base64 string into the `data.app.key` section of this secret.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
data:
  app.key: |
