apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  terminationGracePeriodSeconds: 1
  restartPolicy: Never
  containers:
    - name: nginx
      image: nginx:mainline-alpine3.24-slim
      volumeMounts:
        - name: pod-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: pod-volume
      persistentVolumeClaim:
        claimName: simple-pvc
