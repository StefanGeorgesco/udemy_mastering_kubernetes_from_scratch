apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simple-statefulset
spec:
  selector:
    matchLabels:
      app: simple-app
  replicas: 3
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: nginx
          image: nginx:mainline-alpine3.24-slim
          startupProbe:
            exec: # for demo purposes only
              command:
                - /bin/sh
                - -c
                - echo "<p>$(hostname)</p>" >> /usr/share/nginx/html/index.html
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pod-volume-pvc
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: pod-volume-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1G
