apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simple-pvc
spec:
  storageClassName: standard # default
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1G
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-deploy
spec:
  selector:
    matchLabels:
      app: simple-app
  replicas: 3
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: nginx
          image: nginx:mainline-alpine3.24-slim
          startupProbe:
            exec: # for demo purposes only
              command:
                - /bin/sh
                - -c
                - echo "<p>$(hostname)</p>" >> /usr/share/nginx/html/index.html
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: pod-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: simple-pvc
