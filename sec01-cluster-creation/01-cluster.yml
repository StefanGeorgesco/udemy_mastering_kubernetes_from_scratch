# Type `kind create cluster --config .\sec01-cluster-creation\01-cluster.yml` to create the cluster
# Type `kind delete cluster --name dev-cluster` to delete the cluster
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
  - role: worker
  - role: worker
