# create with `kubectl apply -f sec10-ingress/02-simple-ingress/02-simple-ingress.yml`
# list ingresses with `kubectl get ingress` or `kubectl get ing`
# describe an ingress with `kubectl describe ingress simple-ingress`
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-app
                port:
                  number: 80
