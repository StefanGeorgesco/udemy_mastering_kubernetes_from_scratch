kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ingress-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 31234
        hostPort: 31234
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker

# `kind create cluster --config sec10-ingress/01-cluster/ingress-cluster.yml`

# `kubectl apply -k sec10-ingress/01-cluster/ingress-nginx-kind-overlay`

# install metric-server if needed
