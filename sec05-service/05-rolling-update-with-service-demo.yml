# create the deployment with `kubectl create -f .\05-rolling-update-with-service-demo.yml`
# and see the created deployment with `kubectl get all`
# Type `kubectl exec -it pod/demo-pod -- bash` to access the demo pod's shell
# The run `while true; do curl -s http://order-service | grep -o "<title>[^<]*" | tail -c+8; done`
# inside the demo pod's shell
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deploy
  annotations:
    kubernetes.io/change-cause: "deploying v3"
spec:
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
  replicas: 3
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: vinsdocker/k8s-app:v3
          ports:
            - name: "app-port"
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: demo
      image: vinsdocker/util
      args:
        - sleep
        - "3600"
