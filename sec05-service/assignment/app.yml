apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  replicas: 3
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: stefangeorgesco/redis-spring
          ports:
            - name: "app-port"
              containerPort: 8080
          env:
            - name: "spring.data.redis.host"
              value: "redis-service"
            - name: "spring.data.redis.port"
              value: "6379"
