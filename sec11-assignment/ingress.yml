apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /job
            pathType: Prefix
            backend:
              service:
                name: job-service
                port:
                  number: 8080
          - path: /candidate
            pathType: Prefix
            backend:
              service:
                name: candidate-service
                port:
                  number: 8080
