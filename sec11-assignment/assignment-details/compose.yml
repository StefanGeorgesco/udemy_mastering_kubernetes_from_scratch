services:
  mongo:
    image: mongo:4.4-focal
    volumes:
      - ./data:/docker-entrypoint-initdb.d:ro
  job-service:
    image: stefangeorgesco/job-service
    depends_on:
      - mongo
    environment:
      spring.mongodb.uri: mongodb://job_user:job_password@mongo:27017/job
  candidate-service:
    image: stefangeorgesco/candidate-service
    depends_on:
      - mongo
      - job-service
    environment:
      spring.mongodb.uri: mongodb://candidate_user:candidate_password@mongo:27017/candidate
      job.service.url: http://job-service:8080/job/
  front-end:
    image: stefangeorgesco/dice-frontend
    depends_on:
      - candidate-service
      - job-service
  routing-rules:
    image: nginx
    depends_on:
      - candidate-service
      - job-service
      - front-end
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
