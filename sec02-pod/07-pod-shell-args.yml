# create this pod with `kubectl create -f .\07-pod-shell-args.yml`
# and type `kubectl logs simple-pod` to see the shell arguments in action
# Type `kubectl delete -f .\07-pod-shell-args.yml` to delete the pod
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      args:
        - "/bin/sh"
        - "-c"
        - "echo This is my path: $PATH"
