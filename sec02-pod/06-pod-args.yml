# create this pod with `kubectl create -f .\06-pod-args.yml`
# and type `kubectl logs simple-pod` to see the arguments in action
# Type `kubectl delete -f .\06-pod-args.yml` to delete the pod
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: ubuntu
      image: ubuntu
      args:
        - "echo"
        - "Hello, World!"
