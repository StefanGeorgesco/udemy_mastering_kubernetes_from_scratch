# create this pod with `kubectl create -f .\08-pod-termination-grace-period.yml`
# and type `kubectl delete pod simple-pod` to see the termination grace period in action
# Type `kubectl delete -f .\08-pod-termination-grace-period.yml` to delete the pod
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: ubuntu
      image: ubuntu
      args:
        - "sleep"
        - "3600"
