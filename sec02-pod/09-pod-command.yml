# create this pod with `kubectl create -f .\09-pod-command.yml`
# and type `kubectl logs simple-pod` to see the command output
# Type `kubectl delete -f .\09-pod-command.yml` to delete the pod
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  restartPolicy: Never
  containers:
    - name: entrypoint
      image: vinsdocker/k8s-entrypoint
      command:
        - "date"
