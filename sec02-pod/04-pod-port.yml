# create this pod with `kubectl create -f .\04-pod-port.yml`
# and type `kubectl port-forward simple-pod 80:80` to access the pod from the host at http://localhost
# Type `kubectl delete -f .\04-pod-port.yml` to delete the pod
apiVersion: v1
kind: Pod
metadata:
  name: simple-pod
spec:
  containers:
    - name: nginx
      image: nginx:mainline-alpine3.24-slim
      ports:
        - name: "web-port"
          containerPort: 80
